<!--
  Supabase Dashboard → Authentication → Emails → "Confirm signup" → Message body.
  Paste this ENTIRE file. The link uses the token-hash (OTP) flow —
  {{ .TokenHash }} + type=signup — which works CROSS-DEVICE (sign up on desktop,
  open the email on your phone). Do NOT use the default {{ .ConfirmationURL }} —
  that is the PKCE link that only works in the same browser that signed up.
  Requires Site URL = https://pawasave.xyz in Authentication → URL Configuration,
  and /auth/callback handles verifyOtp({ token_hash, type }).
-->
<!doctype html>
<html>
  <body style="margin:0;background:#F2F5F1;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#131A15">
    <div style="max-width:520px;margin:0 auto;padding:28px 20px">
      <div style="background:linear-gradient(158deg,#0E7A50,#0A5537);border-radius:22px;padding:26px 24px;color:#fff">
        <img src="https://pawasave.xyz/logo-email.png" width="52" height="52" alt="PawaSave"
          style="display:block;width:52px;height:52px;border-radius:14px;margin:0 0 14px" />
        <div style="font-size:13px;opacity:.85;letter-spacing:.08em;text-transform:uppercase">PawaSave</div>
        <div style="font-size:24px;font-weight:700;margin-top:8px">Confirm your email</div>
      </div>
      <div style="background:#fff;border:1px solid #E7EBE5;border-top:0;border-radius:0 0 18px 18px;padding:22px 24px;margin-top:-6px">
        <p style="font-size:15px;margin:0 0 12px">Welcome to PawaSave,</p>
        <p style="font-size:14px;line-height:1.6;color:#3a423c;margin:0 0 18px">
          Tap the button below to confirm your email address and activate your account.
        </p>
        <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=signup&next=/"
          style="display:inline-block;background:#0A6B42;color:#fff;text-decoration:none;font-weight:650;font-size:14px;padding:13px 22px;border-radius:12px">Confirm Email</a>
        <p style="font-size:12px;color:#69726C;margin:22px 0 0;line-height:1.6">
          Didn't create an account? You can ignore this email.
          Questions? <a href="mailto:support@pawasave.xyz" style="color:#0A6B42">support@pawasave.xyz</a>
        </p>
      </div>
      <p style="font-size:11px;color:#9AA39C;text-align:center;margin:16px 0 0">
        PawaSave · Save, Ajo, Invest &amp; Borrow · pawasave.xyz
      </p>
    </div>
  </body>
</html>
